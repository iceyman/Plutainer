name: Build and Push (Plutainer, forked from Ayymoss)

# Pushes to GitHub Container Registry (ghcr.io) — free, unlimited, no
# separate secrets needed. Builds from Ayymoss's own Dockerfile
# unmodified. Kept public, as agreed with the maintainer.
# Covers: WaW (t4mp), BO1 (t5mp), BO2 (t6mp), MW3 2011 (iw5mp),
# MW2 2009 (iw4x) — all from this same image, selected via the
# PLUTAINER_GAME env var at deploy time, not at build time.
"on":
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leviathan-plutainer:latest
          no-cache: true
